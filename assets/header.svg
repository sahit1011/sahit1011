<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Anil Sahith Vallepu — Software Engineer: Production AI Systems, Distributed Backends, Low-Latency Inference">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#12233d"/>
      <stop offset="100%" stop-color="#0d3b3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.28" r="0.7">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="14" fill="url(#glow)"/>

  <!-- left accent rule -->
  <rect x="44" y="52" width="4" height="120" rx="2" fill="url(#accentV)"/>

  <g font-family="'DejaVu Sans','Verdana','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="72" y="92" fill="#f8fafc" font-size="44" font-weight="bold"
          letter-spacing="0.4">Anil Sahith Vallepu</text>
    <text x="72" y="128" fill="#7dd3fc" font-size="19" font-weight="bold"
          letter-spacing="1.6">SOFTWARE ENGINEER</text>
    <text x="72" y="160" fill="#cbd5e1" font-size="17">Production AI Systems &#183; Distributed Backends &#183; Low-Latency Inference</text>
  </g>

  <!-- signal in: ECG / edge inference motif -->
  <path d="M72 214 H168 l12 -26 10 46 12 -52 13 32 H330 l16 -20 12 26 13 -40 12 34 H520"
        fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- transit into the cluster -->
  <path d="M520 214 H700" fill="none" stroke="#7dd3fc" stroke-opacity="0.22"
        stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round"/>

  <!-- distributed / multi-agent cluster -->
  <g stroke="#7dd3fc" stroke-opacity="0.32" stroke-width="1.5" fill="none">
    <path d="M948 130 L1048 80 M948 130 L1064 132 M948 130 L1036 196
             M1048 80 L1064 132 M1064 132 L1036 196 M1048 80 L1128 104
             M1064 132 L1136 170"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="948" cy="130" r="7" fill-opacity="0.95"/>
    <circle cx="1048" cy="80" r="5" fill-opacity="0.8"/>
    <circle cx="1064" cy="132" r="5" fill-opacity="0.8"/>
    <circle cx="1036" cy="196" r="5" fill-opacity="0.8"/>
    <circle cx="1128" cy="104" r="3.5" fill-opacity="0.6"/>
    <circle cx="1136" cy="170" r="3.5" fill-opacity="0.6"/>
  </g>
</svg>
